<!DOCTYPE html>
<html>
<head>
    <title>FV Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FV Playground</h1>

    <p>Upload your file here</p>

    <form id="upload_form">
        <label for="cnf-file">upload file here</label>
        <input type="file" id="cnf-file">
        <button type="submit" id="solve-button">Solve</button>
    </form>

    <div id="file-info" class="panel" hidden>
        <h2>File preview</h2>
        <dl class="stats">
            <div><dt>Variables</dt><dd id="file-info-vars">—</dd></div>
            <div><dt>Clauses</dt><dd id="file-info-clauses">—</dd></div>
        </dl>
        <p id="file-info-message" class="muted" hidden></p>
        <pre id="file-info-preview"></pre>
    </div>

    <div id="progress" hidden>
        <div class="progress-track"><div class="progress-bar"></div></div>
        <p class="muted">Solving… (first request after idle may take up to a minute)</p>
    </div>

    <div id="results" class="panel" hidden></div>

    <script src="script.js"></script>
</body>
</html>
